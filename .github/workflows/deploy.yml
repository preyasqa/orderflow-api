name: Deploy OrderFlow API

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Build Docker image
        run: docker build -t orderflow-api:${{ github.sha }} .
      - name: Deploy
        run: echo "Deploy step goes here"
